name: Lean Action CI

# What a landing owes (AGENTS.md, Working), run on every push: the proofs, then the behaviour
# gates, the runs compared with an outside implementation. One build job builds the core, the law
# graph and the tools once and caches them by commit; every other job restores that cache and runs
# `make` targets (`make help` lists them):
#
#   build        the proofs: the core and the law graph (`make build`), and the tool roots
#   lean-gates   the Lean-side gates: the native conformance, the generated files' drift, the
#                semantics report's refusals, the documents' references, the checkers' self-tests
#   ts-gates     the outside oracles in TypeScript: Effect rc.112's runtime (truth, the corpus,
#                the schema codec) and tsgo 7 (the printed target, the reader, the diagnostics)
#   ocaml-gates  the OCaml route: the LCNF faces re-cut and held, the OCaml lane, the compiler
#   site         the documentation site (decisions row 363), deployed when the secrets are set
#
# The long censuses run nightly, one job each, and the proofs are replayed weekly from a fresh
# checkout with no cache. The batteries and the whole-tree axiom gate run at a sweep, by name
# (`make check-slow`, `make check-roots`). The setup steps are the local actions under
# .github/actions: the toolchain and the cache, the pinned TypeScript, the OCaml compiler.
#
# A pull request is not a trigger: its branch is pushed here, so it ran twice.

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"   # nightly: the census lanes
    - cron: "17 4 * * 1"   # weekly: the proof replay with no cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  LEAN_NUM_THREADS: 2
  BUN_VERSION: 1.3.14
  NODE_VERSION: 22.23.2
  OCAML_COMPILER: 5.1.1

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean
        with:
          save: "true"
      - name: The core and the law graph (the proofs), then the tool roots
        run: make build build-tools

  lean-gates:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # a document's `git:<rev>:<path>` citation resolves against the history
      - uses: ./.github/actions/lean
      - run: make doctor
      - name: Native conformance, generated drift, the semantics refusals, the documents, the checkers' self-tests
        run: make check-native check-gen check-semantics check-docs check-tools

  ts-gates:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean
      - uses: ./.github/actions/typescript
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - run: make doctor
      - name: Effect rc.112's runtime and tsgo 7 against the tree
        run: make check-truth check-corpus check-schema-codec check-target check-ts-reader check-tsdiag check-ingest-smoke

  ocaml-gates:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean
      - uses: ./.github/actions/ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
      - run: make doctor OCAML="opam exec --"
      # The two LCNF artefacts are cut from the tree's own LCNF. Re-cutting them here and refusing
      # a difference is what makes "the engine runs the same algebra" a gate; the OCaml lane then
      # compiles the artefacts this step just wrote.
      - name: The LCNF artefacts re-cut from the tree and held against the committed ones
        run: |
          make gen-lcnf
          git diff --exit-code --stat -- ocaml/gen/api_gen.ml ocaml/engine/api_engine.ml ocaml/gen/closure-api_gen.tsv ocaml/gen/closure-api_engine.tsv
      - name: The OCaml lane and the compiler conformance profile
        run: make check-ocaml check-compiler OCAML="opam exec --"

  # `make site` builds the site from the cached build into .lake/gen/site, standard files only, and
  # the job keeps it as an artifact. With the repository secrets CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID it also deploys to the Cloudflare Pages project effect4-docs: the main
  # branch as production, any other branch as a preview. The owner deploys from the Mac with
  # `make deploy-site` (wrangler's sign-in) until the secrets are set.
  site:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean
      - name: Build the documentation site
        run: make site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: .lake/gen/site
          retention-days: 7
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .lake/gen/site --project-name=effect4-docs --branch=${{ github.ref_name }}

  # ---------------------------------------------------------------- nightly, one job each
  # Each census lane is its own job, so one failure leaves the others' results standing. Each
  # restores the last cache of the same pins and builds what changed.

  nightly-gen-full:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean
        with:
          save: "true"
      - uses: ./.github/actions/typescript
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Every generated group re-cut from scratch, host-cut groups included, and compared
        run: make build check-gen-full

  nightly-ingest:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean
        with:
          save: "true"
      - uses: ./.github/actions/typescript
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - uses: ./.github/actions/ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
      - name: The full ingest census (the constructed foreign corpus through both recognizers, the OCaml decode)
        run: make build check-ingest OCAML="opam exec --"

  nightly-host:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean
        with:
          save: "true"
      - uses: ./.github/actions/typescript
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: The host protocol and the runtime census
        run: make build check-host-protocol check-census

  nightly-schema:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lean
        with:
          save: "true"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned Schema host profile (TypeScript 7.0.2, the language service)
        run: npm ci --prefix harness/schema-host --no-audit --no-fund
      - name: The Schema slice on the pinned host (generation and tag pins)
        env:
          EFFECT4_EFFECT_NODE_MODULES: ${{ github.workspace }}/harness/schema-host/node_modules
        run: make build check-schema-ts check-schema-pins

  proof-replay:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - name: Rebuild everything from a fresh checkout, no cache; the axiom audit runs inside
        run: make build check-roots
