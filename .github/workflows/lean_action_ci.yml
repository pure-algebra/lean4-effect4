name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Build production library
        run: lake build Effect4
      - name: Self-test Effect4 trust gate
        run: ./scripts/test-trust-gate.sh
      - name: Verify Schema structural assurance join
        run: ./scripts/test-schema-structural-assurance-gate.sh
      - name: Verify Effect runtime census join
        run: ./scripts/check-effect-runtime-census.sh
      # The hermetic lane of the sweep: the internal-citations and
      # effect-runtime-census gates, which regenerate from Lean and compare
      # bytes and need no node and no installed Effect package. Gates ran
      # nowhere but a hand-driven local sweep until wave 0, which is why drift
      # gates could stay red on main without anyone noticing (survey finding
      # H5). They are portable since scripts/lib/portable.sh replaced
      # `shasum -a 256` and `sed -i ''` (finding H36). The census above is
      # inside the subset too and hits its stamp the second time, so it costs
      # nothing to leave both.
      - name: Sweep the hermetic gates
        run: ./scripts/sweep.sh --hermetic
