name: Lean Action CI

# One cached build, then the checks as parallel jobs that need it; the long censuses
# nightly; the axiom audit replayed weekly from a fresh checkout with no cache.
# Every job runs `make` targets (see the Makefile; `make help` lists them).
# `leanprover/lean-action` restores and saves `.lake` for every job (its own cache,
# keyed on the runner, the Lake manifest and the commit, with a manifest-only fallback).

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"   # nightly: the full census lane
    - cron: "17 4 * * 1"   # weekly: the proof replay with no cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  LEAN_NUM_THREADS: 2
  BUN_VERSION: 1.3.14
  NODE_VERSION: 22.23.2

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Historical citation receipts resolve against immutable commits.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - name: Build the core, the proof graph, the batteries and the axiom audit
        run: make build
      - name: Build the generator and checker roots
        run: make build-tools

  check:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the pinned TypeScript dependencies
        run: bun install --frozen-lockfile --cwd ts/eff
      - name: The per-change tier (build, roots, generated drift, catch-all arms, layouts, citations, the TypeScript reader)
        run: make check

  check-tools:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - name: The checkers' own self-tests (planted defects must be refused)
        run: make check-tools

  check-host:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned TypeScript dependencies
        run: bun install --frozen-lockfile --cwd ts/eff
      - name: Install the pinned Schema host profile
        run: npm ci --prefix harness/schema-host --no-audit --no-fund
      # The OCaml switch is not installed on the runner; the OCaml differentials run on
      # the owner's machines (`make check-ocaml`) until an opam step is added here.
      - name: The outside oracles (truth, T0, the schema codec, the ingest smoke)
        env:
          EFFECT4_EFFECT_NODE_MODULES: ${{ github.workspace }}/harness/schema-host/node_modules
        run: make build check-truth check-target check-schema-codec check-ingest-smoke

  nightly:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned TypeScript dependencies
        run: bun install --frozen-lockfile --cwd ts/eff
      - name: Install the pinned Schema host profile
        run: npm ci --prefix harness/schema-host --no-audit --no-fund
      - name: The census lane (the full ingest run, the host protocol, the runtime and stream censuses, the Schema slice)
        env:
          EFFECT4_EFFECT_NODE_MODULES: ${{ github.workspace }}/harness/schema-host/node_modules
        run: make build check-ingest check-host-protocol check-census check-streams check-schema-ts check-schema-pins check-schema-surface check-schema-host

  proof-replay:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - name: Rebuild everything from a fresh checkout, no cache; the axiom audit runs inside
        run: make build check-roots
