name: Lean Action CI

# One build, cached by commit, then the checks as parallel jobs that need it; the long
# censuses nightly in separate jobs; the axiom audit replayed weekly from a fresh checkout
# with no cache. Every job runs `make` targets (see the Makefile; `make help` lists them).
#
# The build cache is this file's own (`actions/cache`, keyed on the runner, the Lake
# manifest, the toolchain and the commit, with a manifest-level fallback): the Lean
# action's built-in cache saves inside the action, before `make build` runs, so it never
# carried the outputs the check jobs need. The action is used for the toolchain only.
#
# Two pinned TypeScript installs, each with its consumers: ts/eff (effect rc.112, the
# sqlite driver, TypeScript 5.9.2) for the truth harness, the type oracle, the schema
# codec, the reader and the ingest; harness/schema-host (TypeScript 7.0.2 with the
# language service) only for the Schema harnesses, selected through
# EFFECT4_EFFECT_NODE_MODULES in the jobs that run them and nowhere else.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"   # nightly: the census lanes
    - cron: "17 4 * * 1"   # weekly: the proof replay with no cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  LEAN_NUM_THREADS: 2
  BUN_VERSION: 1.3.14
  NODE_VERSION: 22.23.2
  OCAML_COMPILER: 5.1.1

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Historical citation receipts resolve against immutable commits.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
      - name: Build the core, the proof graph, the batteries and the axiom audit
        run: make build
      - name: Build the generator and checker roots
        run: make build-tools

  check:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the pinned TypeScript dependencies
        run: bun install --frozen-lockfile --cwd ts/eff
      - run: make doctor
      - name: The per-change tier (build, roots, generated drift, catch-all arms, layouts, citations, the TypeScript reader)
        run: make check

  check-tools:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: The checkers' own self-tests (planted defects must be refused)
        run: make check-tools

  check-host:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned TypeScript dependencies
        run: bun install --frozen-lockfile --cwd ts/eff
      - run: make doctor
      - name: The outside oracles (truth, T0, the schema codec, the ingest smoke)
        run: make build check-truth check-corpus check-target check-schema-codec check-ingest-smoke

  check-ocaml:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
      - name: Install the OCaml build tools and exact clock dependency
        run: opam install --yes dune ocamlfind zarith.1.14
      - run: make doctor OCAML="opam exec --"
      # The engine's four faces are cut from the tree's own LCNF, and nothing held them: the
      # committed api_engine.ml was four `Ty` constructors behind the source for the whole of
      # L5 and only the nightly would have said so. Re-cutting them here and refusing a
      # difference is what makes "the engine runs the same algebra" a gate. The OCaml lane
      # below then compiles the faces this step just wrote.
      - name: The four LCNF faces re-cut from the tree and held against the committed ones
        run: |
          make gen-lcnf
          git diff --exit-code --stat -- ocaml/gen/fibers_gen.ml ocaml/gen/machine_gen.ml ocaml/gen/api_gen.ml ocaml/engine/api_engine.ml
      - name: The OCaml lane (the eff goldens and wire tests, the engine tests, the three-engine differential over the printed corpus, the seam check)
        run: make build check-ocaml OCAML="opam exec --"
      - name: The compiler conformance profile (Lean-emitted OCaml for normalization, compiled and run, plus one emitted-code mutation)
        run: python3 scripts/check-conform.py compiler

  # ---------------------------------------------------------------- nightly, one job each
  # Each census lane is its own job so that one failure leaves the others' results standing.

  nightly-gen-full:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install the pinned TypeScript dependencies
        run: bun install --frozen-lockfile --cwd ts/eff
      - name: Every generated group re-cut from scratch, host-cut groups included, and compared
        run: make build check-gen-full

  nightly-ingest:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_COMPILER }}
      - run: opam install --yes dune ocamlfind zarith.1.14
      - name: Install the pinned TypeScript dependencies
        run: bun install --frozen-lockfile --cwd ts/eff
      - name: The full ingest census (the constructed foreign corpus through both recognizers, the OCaml decode)
        run: make build check-ingest OCAML="opam exec --"

  nightly-host:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned TypeScript dependencies
        run: bun install --frozen-lockfile --cwd ts/eff
      - name: The host protocol and the runtime census
        run: make build check-host-protocol check-census

  nightly-schema:
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the pinned Schema host profile (TypeScript 7.0.2, the language service)
        run: npm ci --prefix harness/schema-host --no-audit --no-fund
      - name: The Schema slice on the pinned host (generation, the tag and field pins, the two harnesses)
        env:
          EFFECT4_EFFECT_NODE_MODULES: ${{ github.workspace }}/harness/schema-host/node_modules
        run: make build check-schema-ts check-schema-pins check-schema-host

  proof-replay:
    if: github.event_name == 'schedule' && github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          use-github-cache: false
      - name: Rebuild everything from a fresh checkout, no cache; the axiom audit runs inside
        run: make build check-roots
