name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 2

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Historical citation receipts resolve against immutable commits.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install the pinned surface compiler
        run: bun install --frozen-lockfile --cwd ts/eff
      - name: Build production library
        run: lake build Effect4
      # The green battery and the axiom gate: `Test` is the `Test.All` root plus
      # exactly its import closure (lakefile.toml), so this is what runs
      # `#effect4_axiom_gate` and the module-closure check.
      - name: Build the green test battery
        run: lake build Test
      - name: Self-test Effect4 trust gate
        run: ./scripts/test-trust-gate.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Install the pinned Schema host profile
        run: npm ci --prefix harness/schema-host --no-audit --no-fund
      - name: Verify Schema structural assurance join
        env:
          EFFECT4_EFFECT_NODE_MODULES: ${{ github.workspace }}/harness/schema-host/node_modules
        run: ./scripts/test-schema-structural-assurance-gate.sh
      - name: Verify Effect runtime census join
        run: ./scripts/check-effect-runtime-census.sh
      - name: Test citation detector reactions
        run: python3 scripts/test-source-citations.py && bash scripts/test-internal-citations-gate.sh
      # The pinned-source lane includes surface extraction using the compiler above;
      # it does not execute the Effect host runtime or require an OCaml switch.
      - name: Sweep the hermetic gates
        run: ./scripts/sweep.sh --hermetic
