<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">
  <title>Study (b): the program tree of pAcquireClosed with a Point as a cursor and the frame stack as its continuation. Paths follow Node.child (Compile.lean:63-100); the Point is Compile.lean:112-129; the stack is FrameFiber.stack (Frames.lean:287-291), top first. The moment shown is trace index 4: fiber 0 parks on token 0 awaiting fiber 1.</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f2a"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#f7f4ee"/>
  <text x="24" y="24" font-family="Georgia, 'Iowan Old Style', serif" font-size="15" fill="#1b1f2a">pAcquireClosed — the program, and where fiber 0 stands at i = 4</text>

  <!-- ===== the tree: indentation = depth (position, containment); path written at every node (nominal address) ===== -->
  <g id="tree" fill="#1b1f2a">
    <text x="24" y="60" fill="#8a8f98">path</text>
    <text x="120" y="60" fill="#8a8f98">program (sexp form; a variable is a position in the environment, Eff.lean:217-218)</text>

    <text x="24" y="86" fill="#8a8f98">[]</text>
    <text x="120" y="86">(bind</text>
    <text x="24" y="108" fill="#8a8f98">[0]</text>
    <text x="140" y="108">(perform Ref.make (lit 0))</text>
    <text x="24" y="130" fill="#8a8f98">[1]</text>
    <text x="140" y="130">(bind</text>
    <text x="24" y="152" fill="#8a8f98">[1 0]</text>
    <text x="160" y="152">(scoped</text>
    <text x="24" y="174" fill="#8a8f98">[1 0 0]</text>
    <text x="180" y="174">(withFiber (fork</text>
    <text x="24" y="196" fill="#8a8f98">[1 0 0 0 0]</text>
    <text x="200" y="196">(acquireRelease</text>
    <text x="24" y="218" fill="#8a8f98">[1 0 0 0 0 0]</text>
    <text x="220" y="218">(succeed (lit 7))</text>
    <text x="24" y="240" fill="#8a8f98">[1 0 0 0 0 1]</text>
    <text x="220" y="240">(perform Ref.set (var 0) (var 1)))         ; release: env ++ [a, exit]</text>
    <text x="200" y="262">{startImmediately false, daemon false, mask inherit})))</text>
    <text x="24" y="284" fill="#8a8f98">[1 1]</text>
    <text x="160" y="284">(bind</text>
    <!-- the cursor: the Point of fiber 0 -->
    <rect x="172" y="294" width="300" height="20" fill="none" stroke="#a86b00" stroke-width="1.5"/>
    <path d="M160,298 L170,304 L160,310 z" fill="#a86b00"/>
    <text x="24" y="308" fill="#a86b00">[1 1 0]</text>
    <text x="180" y="308" fill="#1b1f2a">(awaitFiber (var 1) awaitValue)</text>
    <text x="24" y="330" fill="#8a8f98">[1 1 1]</text>
    <text x="180" y="330">(perform Ref.get (var 0)))))</text>
  </g>

  <!-- second cursor: where fiber 1 will enter (its program is the subterm at [1 0 0 0 0]); no stack yet: it has not entered -->
  <rect x="192" y="186" width="160" height="20" fill="none" stroke="#1b1f2a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="24" y="356" fill="#8a8f98" font-size="10">dashed box: fiber 1's root subterm at [1 0 0 0 0] — forked at i = 2, not yet entered, so it has no stack and no cursor.</text>

  <!-- ===== the Point, written as a record ===== -->
  <g transform="translate(560,70)">
    <rect x="0" y="0" width="416" height="150" fill="none" stroke="#a86b00" stroke-width="1.5"/>
    <text x="12" y="22" font-family="Georgia, serif" font-size="13" fill="#a86b00">Point of fiber 0 (Compile.lean:112-129)</text>
    <text x="12" y="46" fill="#1b1f2a">root   0</text>
    <text x="12" y="64" fill="#1b1f2a">path   [1 1 0]</text>
    <text x="12" y="82" fill="#1b1f2a">env    [cell·0  fiber·1]        ; a0, a1 — handles, allocation identity</text>
    <text x="12" y="100" fill="#1b1f2a">fuel   ▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▮▯  997 / 1000</text>
    <text x="12" y="118" fill="#1b1f2a">choices []                       ; `Point.tape` in the source — rename, §5</text>
    <text x="12" y="136" fill="#8a8f98" font-size="10">fuel is a gauge (budget), drawn as a bar, never as a position on the reading axis (DB-04).</text>
  </g>

  <!-- ===== the frame stack: the continuation as data, top first ===== -->
  <g transform="translate(560,240)">
    <rect x="0" y="0" width="416" height="176" fill="none" stroke="#1b1f2a" stroke-width="1.5"/>
    <text x="12" y="22" font-family="Georgia, serif" font-size="13" fill="#1b1f2a">Frame stack of fiber 0 at i = 4 (top first; Frames.lean:287-291)</text>
    <text x="12" y="46" fill="#8a8f98">current</text>
    <text x="90" y="46" fill="#1b1f2a">async (registerAwait fiber·1)  — parked, token 0</text>
    <rect x="12" y="58" width="392" height="22" fill="#ffffff" stroke="#1b1f2a"/>
    <text x="20" y="73" fill="#1b1f2a">0  onSuccess  → contA at [1 1 1]  env [cell·0 fiber·1]</text>
    <text x="12" y="100" fill="#8a8f98" font-size="10">bind's rest is the one frame (Eff.lean:264; Frames.lean:117). The outer binds' frames were</text>
    <text x="12" y="113" fill="#8a8f98" font-size="10">popped when [0] and [1 0] finished; `scoped`'s close ran inside [1 0] (the enclosure of a2).</text>
    <text x="12" y="140" fill="#1b1f2a">Reconstructed by folding FrameEvent.pushed/popped (Frames.lean:314-329);</text>
    <text x="12" y="155" fill="#1b1f2a">the corpus reduces them to the count `frames: 38`, so this stack is by hand.</text>
    <text x="12" y="170" fill="#8a8f98" font-size="10">A frame names a Point: the drawn arrow from a frame to a node is the only pointer in this picture.</text>
  </g>
  <!-- arrow from the frame to its continuation node -->
  <path d="M560,309 C520,309 500,330 470,330" fill="none" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>

  <!-- ===== the marks ===== -->
  <g transform="translate(24,440)">
    <rect x="0" y="0" width="952" height="140" fill="none" stroke="#c9ccd3"/>
    <text x="12" y="20" font-family="Georgia, serif" font-size="13" fill="#1b1f2a">Marks</text>
    <path d="M12,32 L22,38 L12,44 z" fill="#a86b00"/>
    <text x="30" y="42" fill="#1b1f2a">cursor — the Point: the node at `path` with `env`. Host hue because the cursor is where the run stands between decisions (Reichenbach's R: the reference time of a reading).</text>
    <text x="12" y="64" fill="#8a8f98">[1 1 0]</text>
    <text x="90" y="64" fill="#1b1f2a">path — an occurrence address: program cid + path (cas-design §1). Written, never coloured; indentation carries depth (position for containment).</text>
    <rect x="12" y="76" width="60" height="16" fill="#ffffff" stroke="#1b1f2a"/>
    <text x="80" y="88" fill="#1b1f2a">frame — one continuation, a first-order value naming a Point. Stacked boxes, top first: the stack is a list (enclosure for the LIFO).</text>
    <text x="12" y="112" fill="#1b1f2a">cell·0  fiber·1</text>
    <text x="140" y="112" fill="#1b1f2a">handle — allocation identity, `Val.handle kind key` (Val.lean:109-111). The middle dot says "index into this run's stores", not content.</text>
    <text x="12" y="130" fill="#8a8f98" font-size="10">Terms are not nodes (Compile.lean:61-62): `(lit 7)`, `(var 0)` carry no path and get no cursor.</text>
  </g>
</svg>
