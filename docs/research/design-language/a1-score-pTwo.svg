<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">
  <title>Study (a1): pTwo as a score. Reading axis = trace index (equal steps, never time). Lanes = fibers in allocation order. Bar lines = decisions on the tape. Source: harness/truth/corpus.json, program pTwo, 23 events; tape [evaluate 0, flush].</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b1f2a"/>
    </marker>
    <marker id="arrhost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a86b00"/>
    </marker>
    <marker id="arrgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#f7f4ee"/>

  <!-- title block: the job, in the display face -->
  <text x="24" y="22" font-family="Georgia, 'Iowan Old Style', serif" font-size="15" fill="#1b1f2a">pTwo</text>
  <text x="80" y="22" fill="#1b1f2a">job = program pTwo · fuel 1000 · tape (evaluate 0) (flush) · outcome finished · 3 fibers · 23 events</text>

  <!-- tape strip: one cell per decision; a decision is a measure -->
  <g id="tape">
    <rect x="118" y="34" width="264" height="26" fill="none" stroke="#a86b00" stroke-width="1.5"/>
    <text x="126" y="51" fill="#a86b00">0  evaluate 0</text>
    <rect x="382" y="34" width="748" height="26" fill="none" stroke="#a86b00" stroke-width="1.5"/>
    <text x="390" y="51" fill="#a86b00">1  flush</text>
    <text x="24" y="51" fill="#a86b00">tape</text>
    <!-- bar lines: where a decision's segment of the trace begins -->
    <line x1="118" y1="60" x2="118" y2="392" stroke="#a86b00" stroke-width="1.5"/>
    <line x1="382" y1="60" x2="382" y2="392" stroke="#a86b00" stroke-width="1.5"/>
    <line x1="1130" y1="60" x2="1130" y2="392" stroke="#a86b00" stroke-width="1.5"/>
  </g>

  <!-- index row: the reading order. Equal spacing by construction. -->
  <g id="index" fill="#8a8f98" text-anchor="middle">
    <text x="24" y="84" text-anchor="start">i</text>
    <text x="140" y="84">1</text><text x="184" y="84">2</text><text x="228" y="84">3</text><text x="272" y="84">4</text>
    <text x="316" y="84">5</text><text x="360" y="84">6</text><text x="404" y="84">7</text><text x="448" y="84">8</text>
    <text x="492" y="84">9</text><text x="536" y="84">10</text><text x="580" y="84">11</text><text x="624" y="84">12</text>
    <text x="668" y="84">13</text><text x="712" y="84">14</text><text x="756" y="84">15</text><text x="800" y="84">16</text>
    <text x="844" y="84">17</text><text x="888" y="84">18</text><text x="932" y="84">19</text><text x="976" y="84">20</text>
    <text x="1020" y="84">21</text><text x="1064" y="84">22</text><text x="1108" y="84">23</text>
  </g>

  <!-- lane labels -->
  <g fill="#1b1f2a">
    <text x="24" y="134" font-family="Georgia, serif" font-size="13">fiber 0</text>
    <text x="24" y="164" fill="#8a8f98">queue 0</text>
    <text x="24" y="234" font-family="Georgia, serif" font-size="13">fiber 1</text>
    <text x="24" y="264" fill="#8a8f98">queue 1</text>
    <text x="24" y="334" font-family="Georgia, serif" font-size="13">fiber 2</text>
    <text x="24" y="364" fill="#8a8f98">queue 2</text>
  </g>

  <!-- ===== fiber 0 ===== -->
  <!-- running 1..6 -->
  <line x1="140" y1="130" x2="360" y2="130" stroke="#1b1f2a" stroke-width="3"/>
  <!-- entered -->
  <path d="M134,124 L142,130 L134,136 z" fill="#1b1f2a"/>
  <!-- fork marks on the parent -->
  <text x="184" y="121" text-anchor="middle" fill="#1b1f2a">+1</text>
  <text x="272" y="121" text-anchor="middle" fill="#1b1f2a">+2</text>
  <!-- park on token 0: the rest -->
  <rect x="352" y="122" width="16" height="16" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/>
  <text x="360" y="134" text-anchor="middle" fill="#1b1f2a">0</text>
  <line x1="368" y1="130" x2="1012" y2="130" stroke="#1b1f2a" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>
  <!-- resume with token 0 -->
  <rect x="1012" y="122" width="16" height="16" fill="#1b1f2a"/>
  <text x="1020" y="134" text-anchor="middle" fill="#f7f4ee">0</text>
  <!-- running 22..23 -->
  <line x1="1028" y1="130" x2="1108" y2="130" stroke="#1b1f2a" stroke-width="3"/>
  <path d="M1058,124 L1066,130 L1058,136 z" fill="#1b1f2a"/>
  <!-- final bar: exit success -->
  <line x1="1106" y1="120" x2="1106" y2="140" stroke="#1b1f2a" stroke-width="1.5"/>
  <line x1="1111" y1="120" x2="1111" y2="140" stroke="#1b1f2a" stroke-width="3.5"/>
  <text x="1118" y="134" fill="#1b1f2a">(success (success 2))</text>
  <!-- untrack tick from fiber 1's exit (observer untrackChild) -->
  <line x1="800" y1="126" x2="800" y2="134" stroke="#8a8f98" stroke-width="1.5"/>

  <!-- ===== queue 0 ===== -->
  <line x1="140" y1="160" x2="1108" y2="160" stroke="#c9ccd3" stroke-width="0.75"/>
  <!-- scheduled (hollow) at 3 and 5; ran (filled) at 7 and 10 -->
  <path d="M222,154 L234,160 L222,166 z" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/>
  <text x="228" y="178" text-anchor="middle" fill="#8a8f98">start 1 · p0</text>
  <path d="M310,154 L322,160 L310,166 z" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/>
  <text x="316" y="178" text-anchor="middle" fill="#8a8f98">start 2 · p0</text>
  <path d="M398,154 L410,160 L398,166 z" fill="#1b1f2a"/>
  <path d="M530,154 L542,160 L530,166 z" fill="#1b1f2a"/>
  <!-- waits in queue (FIFO): recorded scheduledTask -> ranTask, same owner, same task -->
  <line x1="236" y1="160" x2="396" y2="160" stroke="#8a8f98" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrgray)"/>
  <line x1="324" y1="160" x2="528" y2="160" stroke="#8a8f98" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrgray)"/>
  <!-- ran (start 1) -> entered 1 ; ran (start 2) -> entered 2 : the task names its target -->
  <path d="M404,166 C404,200 440,196 444,224" fill="none" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>
  <path d="M536,166 C536,260 572,280 578,324" fill="none" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>

  <!-- ===== fiber 1 ===== -->
  <!-- forked at 2: exists, not yet running -->
  <line x1="184" y1="130" x2="184" y2="224" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>
  <line x1="184" y1="230" x2="448" y2="230" stroke="#1b1f2a" stroke-width="1" stroke-dasharray="1 4" opacity="0.5"/>
  <!-- running 8..9 -->
  <path d="M442,224 L450,230 L442,236 z" fill="#1b1f2a"/>
  <line x1="448" y1="230" x2="492" y2="230" stroke="#1b1f2a" stroke-width="3"/>
  <!-- park token 1 (a yield: answered from its own queue) -->
  <rect x="484" y="222" width="16" height="16" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/>
  <text x="492" y="234" text-anchor="middle" fill="#1b1f2a">1</text>
  <line x1="500" y1="230" x2="704" y2="230" stroke="#1b1f2a" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>
  <rect x="704" y="222" width="16" height="16" fill="#1b1f2a"/>
  <text x="712" y="234" text-anchor="middle" fill="#f7f4ee">1</text>
  <line x1="720" y1="230" x2="800" y2="230" stroke="#1b1f2a" stroke-width="3"/>
  <path d="M750,224 L758,230 L750,236 z" fill="#1b1f2a"/>
  <line x1="798" y1="220" x2="798" y2="240" stroke="#1b1f2a" stroke-width="1.5"/>
  <line x1="803" y1="220" x2="803" y2="240" stroke="#1b1f2a" stroke-width="3.5"/>
  <text x="810" y="234" fill="#1b1f2a">(success 1)</text>
  <!-- exit 1 -> observer untrackChild on fiber 0 (bookkeeping edge) -->
  <line x1="800" y1="218" x2="800" y2="138" stroke="#8a8f98" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrgray)"/>

  <!-- ===== queue 1 ===== -->
  <line x1="140" y1="260" x2="1108" y2="260" stroke="#c9ccd3" stroke-width="0.75"/>
  <!-- the yield's own scheduling is NOT a recorded event: drawn as an inferred hollow mark -->
  <path d="M486,254 L498,260 L486,266 z" fill="none" stroke="#8a8f98" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="492" y="278" text-anchor="middle" fill="#8a8f98">resume 1 (inferred)</text>
  <path d="M662,254 L674,260 L662,266 z" fill="#1b1f2a"/>
  <line x1="500" y1="260" x2="660" y2="260" stroke="#8a8f98" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrgray)"/>
  <path d="M668,254 C668,248 700,246 706,238" fill="none" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>

  <!-- ===== fiber 2 ===== -->
  <line x1="272" y1="130" x2="272" y2="324" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>
  <line x1="272" y1="330" x2="580" y2="330" stroke="#1b1f2a" stroke-width="1" stroke-dasharray="1 4" opacity="0.5"/>
  <path d="M574,324 L582,330 L574,336 z" fill="#1b1f2a"/>
  <line x1="580" y1="330" x2="624" y2="330" stroke="#1b1f2a" stroke-width="3"/>
  <rect x="616" y="322" width="16" height="16" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/>
  <text x="624" y="334" text-anchor="middle" fill="#1b1f2a">2</text>
  <line x1="632" y1="330" x2="880" y2="330" stroke="#1b1f2a" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>
  <rect x="880" y="322" width="16" height="16" fill="#1b1f2a"/>
  <text x="888" y="334" text-anchor="middle" fill="#f7f4ee">2</text>
  <line x1="896" y1="330" x2="976" y2="330" stroke="#1b1f2a" stroke-width="3"/>
  <path d="M926,324 L934,330 L926,336 z" fill="#1b1f2a"/>
  <line x1="974" y1="320" x2="974" y2="340" stroke="#1b1f2a" stroke-width="1.5"/>
  <line x1="979" y1="320" x2="979" y2="340" stroke="#1b1f2a" stroke-width="3.5"/>
  <text x="986" y="334" fill="#1b1f2a">(success 2)</text>
  <!-- completion -> resume: exit 2 fires observer (resumeAwait 0 token 0) -> resumedWith 0 token 0 -->
  <path d="M979,318 C990,240 1000,180 1018,140" fill="none" stroke="#1b1f2a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="994" y="238" fill="#1b1f2a" font-size="10">observer → 0/0</text>

  <!-- ===== queue 2 ===== -->
  <line x1="140" y1="360" x2="1108" y2="360" stroke="#c9ccd3" stroke-width="0.75"/>
  <path d="M618,354 L630,360 L618,366 z" fill="none" stroke="#8a8f98" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="624" y="378" text-anchor="middle" fill="#8a8f98">resume 2 (inferred)</text>
  <path d="M838,354 L850,360 L838,366 z" fill="#1b1f2a"/>
  <line x1="632" y1="360" x2="836" y2="360" stroke="#8a8f98" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#arrgray)"/>
  <path d="M844,354 C844,348 876,346 882,338" fill="none" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>

  <!-- no clock staff: this run registers no timer; the staff is omitted, not empty -->
  <text x="24" y="404" fill="#8a8f98">clock: no timer registered in this run (staff omitted)</text>

  <!-- ===== legend ===== -->
  <g id="legend" transform="translate(24,430)">
    <rect x="0" y="0" width="1152" height="196" fill="none" stroke="#c9ccd3"/>
    <text x="12" y="20" font-family="Georgia, serif" font-size="13" fill="#1b1f2a">Marks, and the data level each carries</text>

    <path d="M12,34 L20,40 L12,46 z" fill="#1b1f2a"/>
    <text x="30" y="44" fill="#1b1f2a">entered — the fiber's run loop begins a segment (`RunEvent.started`, Fibers.lean:357). Shape: nominal event.</text>
    <line x1="12" y1="62" x2="40" y2="62" stroke="#1b1f2a" stroke-width="3"/>
    <text x="50" y="66" fill="#1b1f2a">running — value (dark) carries the ordered state running &gt; parked &gt; not-yet. Length is a count of events, never a duration.</text>
    <rect x="12" y="76" width="14" height="14" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/><text x="19" y="87" text-anchor="middle" fill="#1b1f2a">t</text>
    <line x1="30" y1="83" x2="60" y2="83" stroke="#1b1f2a" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>
    <rect x="62" y="76" width="14" height="14" fill="#1b1f2a"/><text x="69" y="87" text-anchor="middle" fill="#f7f4ee">t</text>
    <text x="84" y="87" fill="#1b1f2a">rest — park on token t (`parkedOn`, :361) … resume with t (`resumedWith`, :362). One hollow, one filled: a park resumes once (Cmd.resume guard, :1755-1768).</text>
    <text x="12" y="108" fill="#1b1f2a">+n</text>
    <text x="40" y="108" fill="#1b1f2a">fork of child n on the parent lane; the arrow down is the birth (`forked`, :356); the child's lane is dotted until it enters. Connection with direction = causation.</text>
    <path d="M12,118 L24,124 L12,130 z" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/>
    <path d="M32,118 L44,124 L32,130 z" fill="#1b1f2a"/>
    <text x="54" y="128" fill="#1b1f2a">task scheduled on a queue (`scheduledTask`, :358) … task ran (`ranTask`, :359); p = priority (Dispatcher buckets, :115-147). Dotted hollow = not recorded, inferred from the yield op.</text>
    <line x1="12" y1="140" x2="12" y2="156" stroke="#1b1f2a" stroke-width="1.5"/><line x1="17" y1="140" x2="17" y2="156" stroke="#1b1f2a" stroke-width="3.5"/>
    <text x="28" y="152" fill="#1b1f2a">final bar — exited (`exited`, :376) with its Exit written in the sexp form. A failure lists its reasons flat, in order: ×fail  #die  ⊣interrupt (Cause.lean:408-415, :579-582).</text>
    <line x1="12" y1="166" x2="12" y2="182" stroke="#a86b00" stroke-width="1.5"/>
    <text x="28" y="178" fill="#a86b00">bar line — a host decision (`RunDecision`, :429-448). Host hue; a measure is what the machine does under one decision. Bar lines are the only place the tape touches the score.</text>
    <text x="12" y="192" fill="#8a8f98" font-size="10">Not in the trace and therefore not drawn solid: the yield's own scheduling; scope open/close; the row a park awaits. Arrows are drawn only for recorded relations.</text>
  </g>
</svg>
