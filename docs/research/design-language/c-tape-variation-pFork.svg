<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">
  <title>Study (c): the tape of pFork with a fork-here counterfactual, in the annotated-game convention (PGN recursive annotation variations: a variation in parentheses re-plays from the move before it) and the score convention (volta brackets: one passage, two endings). The played line is the corpus; the variation is unverified until replayed and is drawn so.</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f2a"/></marker>
    <marker id="arrhost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a86b00"/></marker>
  </defs>
  <rect width="1000" height="620" fill="#f7f4ee"/>
  <text x="24" y="24" font-family="Georgia, 'Iowan Old Style', serif" font-size="15" fill="#1b1f2a">pFork — the tape, the played line, and one variation</text>

  <!-- ===== the tape as a strip: sprocket index at left, one cell per decision, read downward, one direction ===== -->
  <g id="strip" transform="translate(24,50)">
    <rect x="0" y="0" width="300" height="130" fill="#fffdf8" stroke="#a86b00" stroke-width="1.5"/>
    <text x="10" y="18" fill="#a86b00" font-family="Georgia, serif" font-size="13">tape · pFork · 2 decisions</text>
    <!-- sprocket holes = the index; cells = decisions -->
    <circle cx="16" cy="44" r="3" fill="none" stroke="#a86b00"/>
    <text x="28" y="48" fill="#a86b00">0</text>
    <text x="52" y="48" fill="#1b1f2a">(evaluate 0)</text>
    <text x="200" y="48" fill="#8a8f98" font-size="10">→ log 1..4</text>
    <circle cx="16" cy="70" r="3" fill="none" stroke="#a86b00"/>
    <text x="28" y="74" fill="#a86b00">1</text>
    <text x="52" y="74" fill="#1b1f2a">(flush)</text>
    <text x="200" y="74" fill="#8a8f98" font-size="10">→ log 5..14</text>
    <line x1="10" y1="90" x2="290" y2="90" stroke="#a86b00" stroke-dasharray="6 4"/>
    <text x="10" y="108" fill="#8a8f98" font-size="10">perforation: the tape may be cut after any decision and</text>
    <text x="10" y="121" fill="#8a8f98" font-size="10">spliced to a different continuation — a fork-here.</text>
  </g>

  <!-- ===== the played line and the variation, chess style ===== -->
  <g transform="translate(350,50)">
    <rect x="0" y="0" width="626" height="130" fill="none" stroke="#c9ccd3"/>
    <text x="10" y="18" font-family="Georgia, serif" font-size="13" fill="#1b1f2a">movetext (PGN convention: parentheses hold a variation that re-plays from the decision before it)</text>
    <text x="10" y="46" fill="#1b1f2a">0. evaluate 0   1. flush    ⇒ finished  fiber 0 (success (success 7))  fiber 1 (success 7)</text>
    <text x="10" y="72" fill="#8a8f98">   ( 1. interrupt · → 1   2. flush    ⇒ ? )</text>
    <text x="10" y="98" fill="#1b1f2a" font-size="10">Played line = the receipt. Variation = a job not yet run: (pFork, 1000, tape (evaluate 0) (interrupt none () 1) (flush)).</text>
    <text x="10" y="114" fill="#1b1f2a" font-size="10">Its ⇒ is empty until `replay` prints it; no mark past the cut is inherited. (RunDecision.interruptFrom, Fibers.lean:444-445.)</text>
  </g>

  <!-- ===== the score with a volta bracket: shared passage, two endings ===== -->
  <!-- x(i) = 80 + (i-1)*40 for i = 1..14 within this group -->
  <g transform="translate(24,210)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="13" fill="#1b1f2a">the same, as a score: one passage (measure 0), two endings (measure 1 played; measure 1' variation)</text>
    <!-- shared measure 0 -->
    <line x1="60" y1="20" x2="60" y2="230" stroke="#a86b00" stroke-width="1.5"/>
    <text x="66" y="34" fill="#a86b00">0 evaluate 0</text>
    <line x1="240" y1="20" x2="240" y2="230" stroke="#a86b00" stroke-width="1.5"/>
    <g fill="#8a8f98" text-anchor="middle"><text x="80" y="56">1</text><text x="120" y="56">2</text><text x="160" y="56">3</text><text x="200" y="56">4</text></g>
    <text x="0" y="84" fill="#1b1f2a" font-family="Georgia, serif">fiber 0</text>
    <path d="M74,78 L82,84 L74,90 z" fill="#1b1f2a"/>
    <line x1="80" y1="84" x2="200" y2="84" stroke="#1b1f2a" stroke-width="3"/>
    <text x="120" y="75" text-anchor="middle" fill="#1b1f2a">+1</text>
    <rect x="192" y="76" width="16" height="16" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/><text x="200" y="88" text-anchor="middle" fill="#1b1f2a">0</text>
    <text x="0" y="114" fill="#8a8f98">queue 0</text>
    <path d="M154,108 L166,114 L154,120 z" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/>
    <text x="0" y="150" fill="#1b1f2a" font-family="Georgia, serif">fiber 1</text>
    <line x1="120" y1="84" x2="120" y2="144" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>
    <line x1="120" y1="150" x2="240" y2="150" stroke="#1b1f2a" stroke-width="1" stroke-dasharray="1 4" opacity="0.5"/>

    <!-- volta 1: the played ending -->
    <path d="M250,14 L250,4 L560,4" fill="none" stroke="#1b1f2a" stroke-width="1.25"/>
    <text x="256" y="14" fill="#1b1f2a">1. played</text>
    <text x="246" y="34" fill="#a86b00">1 flush</text>
    <g fill="#8a8f98" text-anchor="middle"><text x="260" y="56">5</text><text x="290" y="56">6</text><text x="320" y="56">7</text><text x="350" y="56">8</text><text x="380" y="56">9</text><text x="410" y="56">10</text><text x="440" y="56">11</text><text x="470" y="56">12</text><text x="500" y="56">13</text><text x="530" y="56">14</text></g>
    <line x1="208" y1="84" x2="470" y2="84" stroke="#1b1f2a" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>
    <rect x="462" y="76" width="16" height="16" fill="#1b1f2a"/><text x="470" y="88" text-anchor="middle" fill="#f7f4ee">0</text>
    <line x1="478" y1="84" x2="530" y2="84" stroke="#1b1f2a" stroke-width="3"/>
    <line x1="528" y1="74" x2="528" y2="94" stroke="#1b1f2a" stroke-width="1.5"/><line x1="533" y1="74" x2="533" y2="94" stroke="#1b1f2a" stroke-width="3.5"/>
    <text x="540" y="88" fill="#1b1f2a" font-size="10">(success (success 7))</text>
    <path d="M254,108 L266,114 L254,120 z" fill="#1b1f2a"/>
    <path d="M260,120 C260,140 282,136 286,144" fill="none" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>
    <path d="M284,144 L292,150 L284,156 z" fill="#1b1f2a"/>
    <line x1="290" y1="150" x2="320" y2="150" stroke="#1b1f2a" stroke-width="3"/>
    <rect x="312" y="142" width="16" height="16" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/><text x="320" y="154" text-anchor="middle" fill="#1b1f2a">1</text>
    <line x1="328" y1="150" x2="380" y2="150" stroke="#1b1f2a" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>
    <rect x="372" y="142" width="16" height="16" fill="#1b1f2a"/><text x="380" y="154" text-anchor="middle" fill="#f7f4ee">1</text>
    <line x1="388" y1="150" x2="440" y2="150" stroke="#1b1f2a" stroke-width="3"/>
    <line x1="438" y1="140" x2="438" y2="160" stroke="#1b1f2a" stroke-width="1.5"/><line x1="443" y1="140" x2="443" y2="160" stroke="#1b1f2a" stroke-width="3.5"/>
    <text x="450" y="154" fill="#1b1f2a" font-size="10">(success 7)</text>
    <path d="M443,138 C452,110 458,100 466,94" fill="none" stroke="#1b1f2a" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="0" y="180" fill="#8a8f98">queue 1</text>
    <path d="M344,174 L356,180 L344,186 z" fill="#1b1f2a"/>
    <path d="M350,174 C350,168 368,166 374,158" fill="none" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>
    <line x1="560" y1="20" x2="560" y2="230" stroke="#a86b00" stroke-width="1.5"/>

    <!-- volta 2: the variation, lighter value, parenthesised, unverified -->
    <g opacity="0.55">
      <path d="M600,14 L600,4 L930,4" fill="none" stroke="#1b1f2a" stroke-width="1.25" stroke-dasharray="4 3"/>
      <text x="606" y="14" fill="#1b1f2a">2. variation ( … )  — unverified</text>
      <line x1="610" y1="20" x2="610" y2="230" stroke="#a86b00" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="616" y="34" fill="#a86b00">1' interrupt ·→1</text>
      <line x1="740" y1="20" x2="740" y2="230" stroke="#a86b00" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="746" y="34" fill="#a86b00">2' flush</text>
      <!-- interrupt recorded on fiber 1 while it has not entered: the antagonist arrives before the agonist moves -->
      <text x="670" y="150" text-anchor="middle" fill="#b0342c" font-size="14">⊣·</text>
      <text x="670" y="166" text-anchor="middle" fill="#8a8f98" font-size="10">interruptRecorded none 1</text>
      <line x1="610" y1="84" x2="900" y2="84" stroke="#1b1f2a" stroke-width="1.5" stroke-dasharray="2 5"/>
      <line x1="610" y1="150" x2="760" y2="150" stroke="#1b1f2a" stroke-width="1" stroke-dasharray="1 4"/>
      <text x="760" y="154" fill="#b0342c">‖? (failure (⊣·))</text>
      <text x="760" y="88" fill="#1b1f2a">‖? (success (failure (⊣·)))</text>
      <text x="610" y="200" fill="#8a8f98" font-size="10">Every mark in this ending is a prediction; the `?` after the final bar says so. Replay the job and the</text>
      <text x="610" y="213" fill="#8a8f98" font-size="10">marks either get a receipt (drawn full) or are corrected. No mark is ever copied from the played line.</text>
    </g>
  </g>

  <g transform="translate(24,470)">
    <rect x="0" y="0" width="952" height="132" fill="none" stroke="#c9ccd3"/>
    <text x="12" y="20" font-family="Georgia, serif" font-size="13" fill="#1b1f2a">What this notation asserts</text>
    <text x="12" y="42" fill="#1b1f2a">A fork-here is Pearl's action step (do): replace decision k with another and re-predict. Abduction is trivial here — the machine has no exogenous</text>
    <text x="12" y="57" fill="#1b1f2a">variables beyond the tape (INV-TAPE-1; ocaml-proposals §0.4) — so a counterfactual is exactly `replay program fuel tape'` (Api.lean:156-162).</text>
    <text x="12" y="79" fill="#1b1f2a">Each ending is one history through the shared moment (Belnap: histories are maximal chains; the tree branches at the cut). There is no</text>
    <text x="12" y="94" fill="#1b1f2a">"thin red line": the played line is privileged only by having a receipt, so it is drawn full and the variation light — value, the ordered variable.</text>
    <text x="12" y="116" fill="#8a8f98" font-size="10">Chess NAGs (!, ?, !?) on a decision are a human annotation, stored as a trait on the tape object, never in its identity (cas-design §4: evidence never in identity).</text>
  </g>
</svg>
