<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">
  <title>Study (a2): pAcquireClosed as a score, with the scope enclosure that closed before the child registered its release. Source: harness/truth/corpus.json, program pAcquireClosed, 10 events + 5 internal; tape [evaluate 0, flush]. Scope open/close are store operations, not trace events: the enclosure is reconstructed from the program and the final stores and is drawn in the resource hue.</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f2a"/></marker>
    <marker id="arrgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6e4e"/></marker>
    <marker id="arrgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#f7f4ee"/>
  <text x="24" y="22" font-family="Georgia, 'Iowan Old Style', serif" font-size="15" fill="#1b1f2a">pAcquireClosed</text>
  <text x="150" y="22" fill="#1b1f2a">job = program pAcquireClosed · fuel 1000 · tape (evaluate 0) (flush) · outcome finished · 2 fibers · 10 events</text>

  <!-- x(i) = 140 + (i-1)*64 ; i = 1..10 -->
  <g id="tape">
    <text x="24" y="51" fill="#a86b00">tape</text>
    <rect x="108" y="34" width="256" height="26" fill="none" stroke="#a86b00" stroke-width="1.5"/>
    <text x="116" y="51" fill="#a86b00">0  evaluate 0</text>
    <rect x="364" y="34" width="384" height="26" fill="none" stroke="#a86b00" stroke-width="1.5"/>
    <text x="372" y="51" fill="#a86b00">1  flush</text>
    <line x1="108" y1="60" x2="108" y2="330" stroke="#a86b00" stroke-width="1.5"/>
    <line x1="364" y1="60" x2="364" y2="330" stroke="#a86b00" stroke-width="1.5"/>
    <line x1="748" y1="60" x2="748" y2="330" stroke="#a86b00" stroke-width="1.5"/>
  </g>
  <g fill="#8a8f98" text-anchor="middle">
    <text x="24" y="84" text-anchor="start">i</text>
    <text x="140" y="84">1</text><text x="204" y="84">2</text><text x="268" y="84">3</text><text x="332" y="84">4</text><text x="396" y="84">5</text>
    <text x="460" y="84">6</text><text x="524" y="84">7</text><text x="588" y="84">8</text><text x="652" y="84">9</text><text x="716" y="84">10</text>
  </g>

  <!-- scope staff: the enclosure. Opened by `scoped` during the evaluate segment, closed when its body (the fork) returned, i.e. before the park at 4. -->
  <text x="24" y="118" fill="#2e6e4e" font-family="Georgia, serif" font-size="13">scope</text>
  <!-- opening bracket at i≈1.5, closing bracket at i≈3.5 ; strategy sequential (scoped's default) -->
  <path d="M176,104 L168,104 L168,128 L176,128" fill="none" stroke="#2e6e4e" stroke-width="2"/>
  <path d="M296,104 L304,104 L304,128 L296,128" fill="none" stroke="#2e6e4e" stroke-width="2"/>
  <line x1="168" y1="116" x2="304" y2="116" stroke="#2e6e4e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="182" y="120" fill="#2e6e4e">scope·k  seq</text>
  <text x="308" y="120" fill="#2e6e4e">closed (success ())</text>
  <!-- registration into a closed scope: the release runs at once, in the registering fiber, with the closing exit (Stores.lean:2167-2168) -->
  <path d="M304,116 C380,116 440,150 470,208" fill="none" stroke="#2e6e4e" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#arrgreen)"/>
  <text x="392" y="140" fill="#2e6e4e" font-size="10">closing exit answers the late registration</text>

  <!-- lanes -->
  <text x="24" y="174" font-family="Georgia, serif" font-size="13" fill="#1b1f2a">fiber 0</text>
  <text x="24" y="204" fill="#8a8f98">queue 0</text>
  <text x="24" y="274" font-family="Georgia, serif" font-size="13" fill="#1b1f2a">fiber 1</text>

  <!-- fiber 0: running 1..4 ; park token 0 at 4 ; resume at 8 ; running 9..10 -->
  <path d="M134,164 L142,170 L134,176 z" fill="#1b1f2a"/>
  <line x1="140" y1="170" x2="332" y2="170" stroke="#1b1f2a" stroke-width="3"/>
  <text x="140" y="192" fill="#1b1f2a" font-size="10">!Ref.make 0 → ?cell·0</text>
  <text x="204" y="161" text-anchor="middle" fill="#1b1f2a">+1</text>
  <rect x="324" y="162" width="16" height="16" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/>
  <text x="332" y="174" text-anchor="middle" fill="#1b1f2a">0</text>
  <text x="332" y="192" fill="#1b1f2a" font-size="10" text-anchor="middle">await fiber·1</text>
  <line x1="340" y1="170" x2="580" y2="170" stroke="#1b1f2a" stroke-width="1.5" stroke-dasharray="2 5" opacity="0.55"/>
  <rect x="580" y="162" width="16" height="16" fill="#1b1f2a"/>
  <text x="588" y="174" text-anchor="middle" fill="#f7f4ee">0</text>
  <line x1="596" y1="170" x2="716" y2="170" stroke="#1b1f2a" stroke-width="3"/>
  <path d="M646,164 L654,170 L646,176 z" fill="#1b1f2a"/>
  <text x="652" y="192" fill="#1b1f2a" font-size="10" text-anchor="middle">!Ref.get cell·0 → ?7</text>
  <line x1="714" y1="160" x2="714" y2="180" stroke="#1b1f2a" stroke-width="1.5"/>
  <line x1="719" y1="160" x2="719" y2="180" stroke="#1b1f2a" stroke-width="3.5"/>
  <text x="726" y="174" fill="#1b1f2a">(success 7)</text>

  <!-- queue 0 -->
  <line x1="140" y1="200" x2="716" y2="200" stroke="#c9ccd3" stroke-width="0.75"/>
  <path d="M262,194 L274,200 L262,206 z" fill="#f7f4ee" stroke="#1b1f2a" stroke-width="1.5"/>
  <text x="268" y="218" text-anchor="middle" fill="#8a8f98">start 1 · p0</text>
  <path d="M390,194 L402,200 L390,206 z" fill="#1b1f2a"/>
  <line x1="276" y1="200" x2="388" y2="200" stroke="#8a8f98" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrgray)"/>
  <path d="M396,206 C396,240 440,240 456,264" fill="none" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>

  <!-- fiber 1: born at 2, enters at 6, runs acquire, release runs at once (closed scope), exits at 7 -->
  <line x1="204" y1="170" x2="204" y2="264" stroke="#1b1f2a" stroke-width="1.25" marker-end="url(#arr)"/>
  <line x1="204" y1="270" x2="460" y2="270" stroke="#1b1f2a" stroke-width="1" stroke-dasharray="1 4" opacity="0.5"/>
  <path d="M454,264 L462,270 L454,276 z" fill="#1b1f2a"/>
  <!-- the acquire region is uninterruptible: double rail -->
  <line x1="460" y1="267" x2="524" y2="267" stroke="#1b1f2a" stroke-width="1.5"/>
  <line x1="460" y1="273" x2="524" y2="273" stroke="#1b1f2a" stroke-width="1.5"/>
  <!-- finalizer: registered (hollow) and ran (filled), key from the supply; here both at once -->
  <circle cx="480" cy="270" r="5" fill="#f7f4ee" stroke="#2e6e4e" stroke-width="1.5"/>
  <circle cx="500" cy="270" r="5" fill="#2e6e4e"/>
  <text x="470" y="292" fill="#2e6e4e" font-size="10">release registered → ran now: !Ref.set cell·0 7 (finalizerProgram 1 success)</text>
  <text x="470" y="306" fill="#8a8f98" font-size="10">contextSet 1 · contextSet 1 bracket the region (internal rows)</text>
  <line x1="522" y1="260" x2="522" y2="280" stroke="#1b1f2a" stroke-width="1.5"/>
  <line x1="527" y1="260" x2="527" y2="280" stroke="#1b1f2a" stroke-width="3.5"/>
  <text x="534" y="274" fill="#1b1f2a">(success 7)</text>
  <!-- completion -> resume 0/0 -->
  <path d="M527,258 C548,220 566,200 584,180" fill="none" stroke="#1b1f2a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="552" y="228" fill="#1b1f2a" font-size="10">observer → 0/0</text>
  <!-- untrack -->
  <line x1="524" y1="170" x2="524" y2="176" stroke="#8a8f98" stroke-width="1.5"/>

  <!-- Allen relations, written out -->
  <g transform="translate(24,340)">
    <rect x="0" y="0" width="952" height="196" fill="none" stroke="#c9ccd3"/>
    <text x="12" y="20" font-family="Georgia, serif" font-size="13" fill="#1b1f2a">What the enclosure says (Allen 1983 relations, read off the score)</text>
    <text x="12" y="42" fill="#1b1f2a">scope·k  precedes (&lt;)  fiber 1's run segment — the scope closed before the child ever entered. Closing is `ScopeState.closed exit` (Scope.lean:81), once.</text>
    <text x="12" y="60" fill="#1b1f2a">fiber 1's lifetime (birth at 2 … exit at 7)  overlaps (o)  scope·k — born inside, ran outside. The bracket pair is the only way this reads at a glance.</text>
    <text x="12" y="78" fill="#1b1f2a">fiber 0's rest (4 … 8)  contains (di)  fiber 1's run segment (6 … 7) — an await is a rest whose interval contains the awaited run.</text>
    <text x="12" y="96" fill="#1b1f2a">release registration  meets (m)  release run — a registration into a closed scope is answered by the closing exit and runs now (Stores.lean:2163-2168).</text>
    <text x="12" y="122" fill="#2e6e4e">Rule: an enclosure must close. An open bracket with no closing bracket on the page is a frontier's owed close and is drawn open, never closed by guess.</text>
    <text x="12" y="146" fill="#8a8f98" font-size="10">Reconstructed, not recorded: scope open, scope close, the closing exit, and the registration key are store facts (Stores.lean:2157-2174), not `RunEvent`s.</text>
    <text x="12" y="160" fill="#8a8f98" font-size="10">The language needs log rows `scopeOpened k strategy fiber`, `scopeClosed k exit`, `finalizerRegistered k scope fiber`, `finalizerRan k exit fiber` beside `finalizerProgram` (:368).</text>
    <text x="12" y="182" fill="#8a8f98" font-size="10">Mask: the double rail on fiber 1 is `acquireRelease`'s uninterruptible acquire (Eff.lean:291; Frames.lean:131-132). A mask is a delivery filter, so it is drawn as a rail, not as a state.</text>
  </g>
</svg>
