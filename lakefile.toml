name = "effect4"
version = "0.1.0"
defaultTargets = ["Effect4", "Effect4Test"]

[[lean_lib]]
name = "Effect4"
globs = ["Effect4.*"]

[[lean_lib]]
name = "Effect4Test"
globs = ["Effect4Test.*"]

# The generic effect algebra, morphisms, transport, families, and the generic
# first-order Flow. Exact commit of tag v0.2.0 of pure-algebra/lean4-effects.
[[require]]
name = "effects"
git = "https://github.com/pure-algebra/lean4-effects"
rev = "fa3cdc96c0dc631e73174aba8a2175a0ef11125a"

# TypeScript as a target: syntax, renderer, identifier profile, host pins.
# Exact commit of tag v0.1.1 of pure-algebra/lean4-typescript.
[[require]]
name = "typescript"
git = "https://github.com/pure-algebra/lean4-typescript"
rev = "8f17b881950476c211853fa76a6b467c037f0c76"
