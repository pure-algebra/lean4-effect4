name = "effect4"
version = "0.1.0"
# The default build is the core and the law graph (owner, 2026-10-10). `Test`, the umbrella
# `Test.All` with the batteries and `#effect4_axiom_gate`, builds by name at a sweep.
defaultTargets = ["Effect4", "Effect4Laws"]

# Lake's local artifact cache (tooling map item 1.3, measured 2026-10-03). A build stores each
# output under its content hash in the toolchain's cache (`lake env printenv LAKE_CACHE_DIR`), and
# a build whose inputs match a stored entry restores the output as a hard link instead of
# rebuilding: a fresh worktree restored all 815 jobs in about a second, against 318 s built. A
# return to any state some worktree has built restores the same way. `restoreAllArtifacts` keeps
# every output in `.lake/build`, where `lake env lean` and the drivers that load an environment
# read them. `lake cache clean` empties the cache; a worktree re-seeds it from its own outputs on
# its next build, so pruning rebuilds nothing.
enableArtifactCache = true
restoreAllArtifacts = true

# Every Lean process of this package is capped at 6 GB (`lean --memory`): a runaway
# elaboration aborts with "memory limit exceeded" instead of taking the machine down
# (docs/research/2026-09-04-s3-volume-plan.md, memory rule).
# Every warning is an error (`-DwarningAsError=true`, owner ruling 2026-09-19): a `sorry` or a
# `native_decide` inside an `example` fails the build where it is written, which is what the
# retired source scan of the trust gate used to catch, and a linter finding is fixed, not read.
[[lean_lib]]
name = "Effect4"
srcDir = "src"
roots = ["Effect4"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The proof graph has its own root; namespaces inside its modules stay unchanged.
[[lean_lib]]
name = "Effect4Laws"
srcDir = "src"
roots = ["Effect4.Laws"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The subset and membership decisions (`sub_tac`, `mem_tac`) compiled to native code and loaded into
# the elaborator of every module that uses them (`precompileModules`). Declared after `Effect4` and
# `Effect4Laws`, whose roots also claim these modules: Lake gives a module to the last library that
# claims it (`Package.findModule?` searches the libraries in reverse). Interpreted, the tactic
# was 14.7 s of `Laws/Machine/Handles` alone.
[[lean_lib]]
name = "Effect4Tactics"
srcDir = "src"
roots = ["Effect4.Laws.Auto.SubsetTac", "Effect4.Laws.Auto.ListSubset"]
precompileModules = true
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The OCaml estate's Lean half (ocaml/README.md): the part of the OCaml language model the
# backend prints through (`OCaml5.Ml`), the LCNF→OCaml backend (`OCaml5.Lcnf`), the `Eff` IR
# emitters (`OCaml5.Eff`) and `--run` drivers under `OCaml5.Tools`. Only what is made directly
# from LCNF, or makes it, lives here (owner rule, 2026-09-17). The root module imports every
# library module; the drivers (`Tools.*`) each declare a top-level `main`, so they are globbed
# separately rather than imported together.
[[lean_lib]]
name = "OCaml5"
srcDir = "src"
roots = ["OCaml5"]
globs = ["OCaml5", "OCaml5.Tools.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The generator of `Canonical` instances and its projection guard
# (docs/research/2026-09-04-cas-trait-plan.md §4): `--run` tools over `Lean.Meta`, not part
# of any audited library; the emitted files carry their own receipts.
[[lean_lib]]
name = "Effect4Gen"
srcDir = "tools"
roots = ["Effect4Gen.Main", "Effect4Gen.Check"]
globs = ["Effect4Gen.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# Early generators inspect loaded declarations without importing Effect4.
[[lean_exe]]
name = "effect4gen"
srcDir = "tools"
root = "Effect4Gen.Exe"
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# Catalogue generators read compiled rows, forms and atom specifications.
[[lean_exe]]
name = "effect4gen-catalogue"
srcDir = "tools"
root = "Effect4Gen.CatalogueExe"
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The Effect4-side `--run` drivers (`tools/Tools/`): thin `main`s over library modules that
# cross to bytes — `Tools.TsGen`, the TypeScript estate's generated files (schemas, JSON
# writers, the profile) from the closed world `OCaml5.Eff.World` reads, and `Tools.Corpus`,
# the printed corpus with Lean's round-trip beside each program. A tool is `IO` over the
# library and is not the library: the root `Tools` is a sibling of `Effect4`, outside the
# axiom gate's `Effect4.*` / `Test.*` audit. Helper modules are shared by tooling. `lake build Tools`
# type-checks the drivers so they cannot rot; `lake env lean -M4096 --run tools/Tools/<X>.lean …`
# runs one. The OCaml estate's drivers stay under `OCaml5.Tools`.
[[lean_lib]]
name = "Tools"
srcDir = "tools"
globs = ["Tools.+", "Drivers.+", "TestSupport.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The report drivers, compiled (`lake exe <name> …`): the semantics report and its refusal controls
# (`make gen-semantics`, `make check-semantics`) and the architecture map (`make gen-architecture`).
# Each loads the environment it reports on at run time, so its own imports are Lean and tool modules.
[[lean_exe]]
name = "semantics-report"
srcDir = "tools"
root = "Drivers.Semantics"
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

[[lean_exe]]
name = "semantics-controls"
srcDir = "tools"
root = "Drivers.SemanticsControls"
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The kernel rung (`make check-kernel`, the sweep tier): every compiled declaration of this
# repository's modules in the closure of the given roots, replayed through the kernel into one
# environment of their dependencies (tools/Drivers/KernelReplay.lean). `--self-test` requires the
# refusal of a forged theorem.
[[lean_exe]]
name = "kernel-replay"
srcDir = "tools"
root = "Drivers.KernelReplay"
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

[[lean_exe]]
name = "architecture-map"
srcDir = "tools"
root = "Tools.Architecture"
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# Shared metaprogramming evidence. No Effect4, Aesop or target-profile dependency.
# Laws and Conform both depend on this seam; neither depends on the other.
[[lean_lib]]
name = "ProofGraph"
srcDir = "tools"
globs = ["ProofGraph.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The proof graph's whole-environment walks, compiled to native code and loaded into the elaborator
# (`precompileModules`): the axiom gate's declaration scan and axiom traversal
# (`ProofGraph.Audit`, `ProofGraph.Axioms`) run natively inside `lake build Test`, where `Test.All`
# ends the critical path. Declared after `ProofGraph`, whose glob also claims them: Lake gives a module to the last library
# that claims it. Both import only Lean, so the shared libraries stay small.
[[lean_lib]]
name = "ProofGraphNative"
srcDir = "tools"
roots = ["ProofGraph.Axioms", "ProofGraph.Audit"]
precompileModules = true
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The projection guard on the generated files, compiled to native code the same way: the `#eval` of
# `Test.Store.DerivedCheck` runs it over the four generated files, and interpreted it took 30 s of
# that module's 33 s (measured 2026-10-03). Declared after `Effect4Gen` and `Tools`, whose roots and
# globs also claim these modules. Both import only Lean.
[[lean_lib]]
name = "Effect4GenNative"
srcDir = "tools"
roots = ["Effect4Gen.Check", "Tools.WireTags"]
precompileModules = true
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# Verification tooling (docs/research/type-tooling/, 2026-09-09): the generic core of
# conformance checks between representations — one report format, separate evidence methods,
# obligations, strict policy readers (`Conform.Core`), the mono-LCNF walkers and semantics
# (`Conform.Lcnf`), layout coherence (`Conform.Layout`, `Conform.Model`), the `Std.Do`
# specification pilot (`Conform.Spec`) — with Effect4 as its first configuration under
# `Conform.Effect4` and the `--run` drivers under `Conform.Cli`. A tool root like `Tools`:
# `import Lean` is allowed here (DI-18), it is outside the axiom gate's audit and imported by
# neither Effect4 runtime nor Laws. OCaml5.Lcnf consumes its generic Source/Lcnf utilities.
# The extensibility rule: no module outside `Conform.Effect4` imports
# `Effect4.*` or `OCaml5.*`; families, roots, policies and manifests reach the generic code as
# arguments or configuration files.
[[lean_lib]]
name = "Conform"
srcDir = "tools"
globs = ["Conform.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The green battery: the audit root and its import closure.
[[lean_lib]]
name = "Test"
# The import-only root reaches Test.All. Owning the root makes every Test import
# buildable on a fresh checkout without globbing the intentionally red batteries.
roots = ["Test"]
globs = ["Test"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The six independently green area batteries; a narrow sweep is
# `lake build TestSchema` rather than a whole-tree build. The globs are `.+`,
# submodules only: `.*` would also select the directory's own module, which
# does not exist.

[[lean_lib]]
name = "TestSchema"
globs = ["Test.Schema.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The batteries evaluate the machine while they elaborate (`#guard`, `#scenario_gate`), and the
# interpreter was most of their time: 504 s of `Test.Dogfood.Scenario.QueueWorkers`' 506 s
# (profiled 2026-10-07, decisions row 327). So `TestProgram` and `TestDogfood` load the native
# library of the core and those of the packages it calls (`dynlibs`, in load order), and the
# elaborator calls native code: that module took 42 s, and the two libraries' modules went from
# 2231 s to 544 s and from 802 s to 98 s, summed. `needs` builds the libraries once, before any
# module: `dynlibs` alone fetches them from each module's setup, and a stale core module was built
# five times at once. `needs` also puts the core library's trace into each module of the two
# libraries, so a core edit rebuilds both. The other batteries gained nothing and paid about 0.4 s
# a module to load, so they stay interpreted. `precompileModules` on the core was measured too, and
# refused: every module downstream of the core then loads its 191 libraries, and the root module
# went from 1.3 s to 21 s.
[[lean_lib]]
name = "TestProgram"
needs = ["@typescript/TypeScript:shared", "@hash/Hash:shared", "Effect4:shared"]
dynlibs = ["@typescript/TypeScript:shared", "@hash/Hash:shared", "Effect4:shared"]
globs = ["Test.Program.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

[[lean_lib]]
name = "TestMachine"
globs = ["Test.Machine.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

[[lean_lib]]
name = "TestCodegen"
globs = ["Test.Codegen.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

[[lean_lib]]
name = "TestStore"
globs = ["Test.Store.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The dogfood scenarios, split from `Test`, whose root also claims them: Lake gives a module to the
# last library that claims it. They and `TestProgram` load the native core (see above).
[[lean_lib]]
name = "TestDogfood"
needs = ["@typescript/TypeScript:shared", "@hash/Hash:shared", "Effect4:shared"]
dynlibs = ["@typescript/TypeScript:shared", "@hash/Hash:shared", "Effect4:shared"]
globs = ["Test.Dogfood.+"]
moreLeanArgs = ["-M6144", "-DwarningAsError=true"]

# The generic effect algebra, morphisms, transport, families, the shared trace
# alphabet, and the coalgebra layer (systems, bisimulations, hosts as comodels,
# typed handlers, indexed signatures). Exact commit of v0.10.1 of
# pure-algebra/lean4-effects (branch `coalgebra`, committed locally 2026-10-09;
# push it before this repository's branch).
[[require]]
name = "effects"
git = "https://github.com/pure-algebra/lean4-effects"
rev = "bf5ab8fd26ee009abbf465821a3664ea20948a49"

# TypeScript as a target: syntax, renderer, identifier profile, host pins.
# Version 0.7.0 includes optional fields, element access and object key forms.
[[require]]
name = "typescript"
git = "https://github.com/pure-algebra/lean4-typescript"
rev = "f5878bf879bd5712db964c2cd12802748c707605"

# Proved SHA-256 for content addresses (src/Effect4/Store/Carrier/Digest.lean): exact commit of
# pure-algebra/lean4-hash, branch module-system (its library is Lean modules, decisions row 200). Its SHA-256 family is audited at zero declarations
# reaching Classical.choice, so a digest stays inside this tree's axiom ceiling.
[[require]]
name = "hash"
git = "https://github.com/pure-algebra/lean4-hash"
rev = "ab7eda433f0390fde7aa240189761540c9744c79"


# Proof search for the law graph (`src/Effect4/Laws/**`) and the batteries: nothing under the
# core root `Effect4` imports it, so the core's import closure (and the LCNF/OCaml pipeline cut
# from it) is unchanged. Used as its README describes (AGENTS.md; shared rules in
# `src/Effect4/Laws/Auto/`). Pinned at the release for this toolchain (v4.33.0); it brings
# `batteries`.
[[require]]
name = "aesop"
git = "https://github.com/leanprover-community/aesop"
rev = "3448c0bcc5ce01b2d1546e483ec3620e32df3d0e"