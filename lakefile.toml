name = "effect4"
version = "0.1.0"
defaultTargets = ["Effect4", "Effect4Test"]

[[lean_lib]]
name = "Effect4"
globs = ["Effect4.*"]

[[lean_lib]]
name = "Effect4Test"
globs = ["Effect4Test.*"]

# The generic effect algebra, morphisms, transport, families, and the generic
# first-order Flow, and the shared trace alphabet. Exact commit of tag v0.3.1
# of pure-algebra/lean4-effects.
[[require]]
name = "effects"
git = "https://github.com/pure-algebra/lean4-effects"
rev = "c28833b3c14431ba2886a0fb66bcc688c86c2589"

# TypeScript as a target: syntax, renderer, identifier profile, host pins.
# Exact commit of tag v0.3.0 of pure-algebra/lean4-typescript.
[[require]]
name = "typescript"
git = "https://github.com/pure-algebra/lean4-typescript"
rev = "1f3959865927ad40407286ad057a6b7dc97cb553"
