name = "cas"
defaultTargets = ["Cas", "CasBackend", "CasExamples", "CasWp"]

# =====================================================================
# THE STRATA
#
# The library is declared in strata, lowest first. The floor is FOUR
# libs, none depending on any other nor on anything else, all four
# feeding the language proper:
#
#   CasValues ┐
#   CasLlm    │
#   CasBytes  ├→ Cas → CasWp → CasBackend → CasMeta   (+ CasExamples)
#   CasProg   ┘
#
#   CasValues    The substrate. Canonical JSON, its two printers, its
#                parser, and the injectivity that makes an address mean
#                one value. Imports nothing from `Cas`.
#   CasLlm       The frozen completion call as a mathematical object,
#                split by kind: LLMs as functions (`Rewriter` —
#                pipelines, schema-forced output, canonicalizers) and
#                LLMs as decision points (`Judge` — the hypothesis
#                lattice, panels and their aggregators; `JudgeRate` —
#                the finite measurement). Imports nothing from `Cas`.
#   CasBytes     The byte codecs, a chain three deep: `Nat32` (the
#                four-byte big-endian scalar), `Bytes` (length-prefixed
#                frames, fixed-width chunks, counted sequences, each
#                primitive carrying forward AND exactness), and `Hex`
#                (the lowercase byte↔text spelling addresses travel
#                in). Every wire form in the package is spelled in
#                these. Imports nothing from `Cas`.
#   CasProg      The free-monad core, store-free: a signature is data
#                (`Sig` — operations and what each answers, composing
#                by sum), and a program is an operation tree over one
#                (`Prog` — done, or one operation and the rest as a
#                function of its answer; a monad, so folding is
#                `List.foldlM`). Nothing about any PARTICULAR operation
#                lives here — the store's operations are `Cas.Lang.Ops`
#                in the stratum above. Imports nothing from `Cas`.
#   Cas          The language proper. Nodes, the store, addresses, the
#                admission judgment, schemas, the data grammar, the
#                program grammar.
#   CasBackend   The TypeScript target plane: what the model emits, and
#                the profile it emits against.
#   CasMeta      The projections that read the compiled library back —
#                the environment walk and the ledgers over it. NOT YET
#                A LIB: these modules live in `tools/` under `Gate`.
#                The name is declared here so the order is settled
#                before the modules move.
#   CasWp        The proof-stratum statement apparatus. It sits ABOVE
#                the language and BELOW the target plane, not off to one
#                side: `Cas/Backend/Universal.lean` and
#                `Cas/Backend/TreeProgCorrect.lean` both import
#                `Cas.Lang.Wp`, so the wp transformer is a dependency of
#                the backend's correctness proofs. This block called it
#                a leaf until `lake exe strata` measured the two edges
#                and refused them.
#   CasExamples  The language used, never part of it. A LEAF, and the
#                only one: nothing imports it, which the gate checks
#                rather than the reader remembering.
#
# ZERO IMPORTS IS NOT A STRATUM. Two modules import nothing at all and
# still get no boundary of their own, and the reasons differ:
#
#   Cas/Backend/Ts.lean     The closed TypeScript fragment and its
#                           fixed-layout printer. It would stand alone
#                           today, but it is one FILE, not a subtree,
#                           and `CasBackend` already globs it as
#                           `Cas.Backend.+` — an own-lib would either
#                           claim one module in two libraries or force
#                           that subtree glob into an exclusion list,
#                           and a one-name glob guards no directory
#                           against the next misfile, which is the whole
#                           argument for the explicit globs below. Nor
#                           would a lib buy the measurement: `lake build
#                           Cas.Backend.Ts` already closes over exactly
#                           that one module, so the standing-alone claim
#                           is checkable as it stands. `CasTs` is NAMED
#                           HERE, like `CasMeta`, so the deferral is a
#                           decision on the record: it becomes a lib
#                           when something wants the printer without the
#                           backend, and not before.
#   Cas/Grammar/Sorts.lean  The sort table — `UInt8` tags and their
#                           partial inverse, nothing else. It STAYS in
#                           the `Cas` stratum: Grammar's other modules
#                           need the model, and a stratum is not carved
#                           around whichever of its files happens to
#                           need no import today.
#
# THE RULE: lower never imports higher. A new module lands in a
# stratum or it is refused — "somewhere under Cas/" is not a home.
#
# ENFORCED BY `lake exe strata --check`, in the `check:cas` gate loop
# and in `gen:strata` before it. The gate reads the `[[lean_lib]]` globs
# below as the membership authority, imports every member module, reads
# the per-module import edges off the compiled environment, and refuses
# — naming the module and the edge — on floor purity, floor
# independence, direction, and a stale exception row. The order above is
# the half it does NOT compute: that is declared in `tools/Strata.lean`,
# mirroring this block, and a library here with no rank there (or a rank
# there naming no library here) refuses the document.
#
# WHY THE GATE EXISTS, in one line: a Lake lib boundary refuses nothing
# — Lake resolves imports across libs of the same package, so a module
# violating the order above still builds green, which the `CasValues`
# lane measured rather than assumed.
#
# KNOWN MISFILES — one. A row is an EDGE the gate would otherwise refuse,
# declared here and mirrored as data in `knownMisfiles` in
# `tools/Strata.lean`; the gate reports it `known` and does not fail, and
# refuses a row that no longer matches anything. Both spellings, or
# neither: an undeclared misfile is the thing this block exists against,
# and a declared one that nothing enforces is a comment.
#
#   `Cas` (the root) imports `Cas.Backend.HttpProfile`
#       The wire face `cas-http/0` is filed under `Cas/Backend/`, so the
#       `Cas.Backend.+` glob claims it for `CasBackend`, while the
#       library root imports it — the root's own front page already
#       names it as the one `Backend/` module it imports. The profile is
#       a PEER of the language rather than something the language
#       emits. Settled by a move (a stratum of its own, or into the
#       `Cas` subtree beside `Cas.Core.Node` and `Cas.Grammar.Sorts`,
#       which are all it consumes), which is a rename across the surface
#       ledger's import set and a slice of its own.
#
# The two rows this block used to name were files in the wrong
# directory, not edges, and both moved at the meta-home migration —
# each into the `Cas` stratum beside what it consumes, carrying a
# `discharges(…)` row where its `owed(…)` marker was:
#   Cas/Values/Canonicalize.lean → Cas/Core/Canonicalize/Json.lean
#   Cas/Values/Refs.lean         → Cas/Core/Refs.lean
# =====================================================================

# The substrate stratum, declared as its own library so the boundary is
# a fact of the build rather than a claim in prose: `lake build
# CasValues` builds the six substrate modules below, plus the front
# page that roots them, and NOTHING else in the package — which is what
# "zero-dependency" has to mean to be worth saying.
#
# The globs name the seven modules one by one instead of globbing the
# `Cas.Values.+` subtree, and that is the whole point. It was measured,
# not guessed: while `Canonicalize` and `Refs` still sat in the subtree,
# a glob pulled those two in and, behind them, the seven
# `Cas.Core`/`Cas.Codec` modules they rest on — a 14-module closure for
# a library whose name promises none of it. Those two have since moved
# into `Cas/Core/`, and the explicit spelling stays for the same reason
# it was written: it refuses the NEXT misfile at the boundary instead of
# admitting it and its closure. The `Gate` lib below is the precedent.
[[lean_lib]]
name = "CasValues"
globs = [
  "Cas.Values",
  "Cas.Values.Cut",
  "Cas.Values.Digits",
  "Cas.Values.Json",
  "Cas.Values.JsonInj",
  "Cas.Values.JsonParse",
  "Cas.Values.Markdown",
]

# The other floor stratum, declared as its own library for the same
# reason: `lake build CasLlm` builds the three LLM-call modules below,
# plus the front page that roots them, and NOTHING else in the package
# — which is the mechanical form of "these abstractions know nothing of
# the store". The split the front page organizes is LLMs as FUNCTIONS
# (`Rewriter`) versus LLMs as DECISION POINTS (`Judge`, `JudgeRate`).
#
# The globs name the four modules one by one rather than globbing the
# `Cas.Llm.+` subtree, following the `CasValues` precedent: a subtree
# glob would silently admit the first store-aware judge someone files
# in the directory, and admitting one is what this boundary exists to
# refuse.
[[lean_lib]]
name = "CasLlm"
globs = [
  "Cas.Llm",
  "Cas.Llm.Judge",
  "Cas.Llm.JudgeRate",
  "Cas.Llm.Rewriter",
]

# THE FRONT PAGE OF `CasBytes`, and there is no other. The two floor
# libs above are each rooted by a published aggregator module; this one
# is deliberately not, because an aggregator would be a module the
# library does not otherwise have — a job added to `lake build` to hold
# prose. What it is: the byte codecs, a pure chain three deep. `Nat32`
# imports nothing and gives the four-byte big-endian scalar with its
# reconstruction lemmas; `Bytes` imports `Nat32` and builds the frames,
# fixed-width chunks and counted sequences the node codec rests on, each
# primitive carrying BOTH directions (forward and exactness); `Hex`
# imports `Bytes` and is the lowercase byte↔text spelling an address
# travels in. Nothing here knows what the bytes MEAN.
#
# The membership test is mechanical, not a matter of taste: a module
# belongs here only if it compiles with no `import Cas.*` outside
# `Cas.Codec.{Nat32,Bytes,Hex}`. `lake build CasBytes` builds exactly
# these three and nothing else in the package, which is what makes the
# claim checkable rather than asserted. Note what the test EXCLUDES:
# `Cas.Codec.NodeCodec`, `Cas.Codec.Sha256` and `Cas.Codec.Separation`
# sit in the same directory and are not in this lib — all three reach
# `Cas.Core.Node` (Separation through NodeCodec), so all three are
# consumers of the store rather than substrate. That is precisely why
# the globs name the three modules one by one instead of globbing
# `Cas.Codec.+`, following `CasValues` and `CasLlm`: a subtree glob here
# would admit those three and the whole `Cas.Core` closure behind them
# on the first build, for a library whose name promises bytes.
#
# OWED: if this stratum ever ships alone, it owes a published root
# module the way `Cas.Values` and `Cas.Llm` are published roots. Until
# then the front page is this block, at the boundary it describes.
[[lean_lib]]
name = "CasBytes"
globs = [
  "Cas.Codec.Nat32",
  "Cas.Codec.Bytes",
  "Cas.Codec.Hex",
]

# THE FRONT PAGE OF `CasProg`, and there is no other — same reasoning as
# `CasBytes` above: no aggregator module, because the prose does not
# need a job. What it is: the free-monad core, and STORE-FREE. `Sig`
# imports nothing and says a language is a set of operations with answer
# types, composing by sum (`⊕ₛ`); `Prog` imports `Sig` and is the
# operation tree over one — done, or one operation and the rest as a
# function of its answer — with `bind`, the `Monad` instance, and the
# two sum injections. That is the whole stratum: the SHAPE of effectful
# computation, with no particular effect in it.
#
# The membership test is mechanical: a module belongs here only if it
# compiles with no `import Cas.*` outside `Cas.Lang.{Sig,Prog}`. `lake
# build CasProg` builds exactly these two and nothing else in the
# package. What the test excludes is the point — `Cas.Lang.Ops` (the
# store's operations) and `Cas.Lang.Handler` (their meaning) are in the
# `Cas` stratum, and a glob over `Cas.Lang.+` would swallow the entire
# language, seventeen modules, into a library whose name promises two.
# Hence the explicit spelling, as in `CasValues`, `CasLlm` and
# `CasBytes`.
#
# OWED: a published root module if this stratum ever ships alone.
[[lean_lib]]
name = "CasProg"
globs = [
  "Cas.Lang.Sig",
  "Cas.Lang.Prog",
]

[[lean_lib]]
name = "Cas"

# The proof-stratum statement apparatus (PDD-2): `Cas/Lang/Wp.lean` is
# the weakest-precondition transformer over the defunctionalized table.
# The `Cas` root does not import it, so it is declared as its own
# library for the same reason `CasBackend` is: `lake build`
# kernel-checks every one of its theorems even though no root imports
# them.
#
# It is NOT a leaf, and this block said it was until `lake exe strata`
# measured otherwise: `Cas.Backend.Universal` and
# `Cas.Backend.TreeProgCorrect` both import `Cas.Lang.Wp`, which is why
# the order above places `CasWp` between `Cas` and `CasBackend` rather
# than beside them. The rest of the old claim survives measurement —
# those two modules are imported by nothing, so `Cas.Lang.Wp` is still
# outside `Walk.libraryImports` and the surface, obligation and law
# ledgers still do not move; adding it to that walk is a promotion, and
# a promotion is a ruling, not a side effect.
[[lean_lib]]
name = "CasWp"
globs = ["Cas.Lang.Wp"]

# The backend modules, elaborated as their own library so `lake build`
# kernel-checks every one of them — in particular the R8 seed pins in
# Cas/Backend/Target.lean, which no tools root imports yet.
[[lean_lib]]
name = "CasBackend"
globs = ["Cas.Backend.+"]

# Consumers of the language, not part of it (the Concrete split): the
# library reflects the language only; examples stay in defaultTargets so
# `lake build` still kernel-checks them.
[[lean_lib]]
name = "CasExamples"
srcDir = "examples"

# The shared tool substrate every tool root imports: `Gate` is the
# driver (fixtures in, emit/--check/--json out) and `Walk` is the
# single environment walk the projections over the compiled library
# share. `Obl` (the docstring obligation harvester) and `Law` (the
# ruling registry and its join) joined them when the debt projection
# needed to read what the obligation and law ledgers read: two exe
# roots cannot import one another — each must declare `main` — so a
# projection shared between them lives in this library. Declared as a
# library so the exe roots can import all four; it is not a default
# target because the exes that drive it are what `check:cas` builds.
[[lean_lib]]
name = "Gate"
srcDir = "tools"
globs = ["Gate", "Walk", "Obl", "Law"]

# The vector emitter: `lake exe vectors` regenerates the committed
# conformance fixtures under vectors/; `--check` is the byte-identity
# gate.
[[lean_exe]]
name = "vectors"
srcDir = "tools"
root = "Vectors"

# The schema emitter: `lake exe schemas` regenerates the committed
# canonical-schema payload fixtures under schemas/ (the cross-runtime
# pin surface); `--check` is the byte-identity gate.
[[lean_exe]]
name = "schemas"
srcDir = "tools"
root = "Schemas"

# The disagreement vector: `lake exe verdicts` regenerates the
# conformance corpus of (code, value, verdict) triples under
# conformance/, with every verdict computed by executing the model
# (`ingest` for codes, `decode` for values); `--check` is the
# byte-identity gate. The TypeScript side replays the corpus through
# `Materialize` and disagreement is a red suite.
[[lean_exe]]
name = "verdicts"
srcDir = "tools"
root = "Verdicts"

# The wire-mirror emitter: `lake exe emitwire` regenerates the effects
# package's generated canonical-schema mirrors at the target the tool
# bakes in (a positional path overrides it); `--check` is the
# byte-identity gate.
[[lean_exe]]
name = "emitwire"
srcDir = "tools"
root = "EmitWire"

# The word-wire emitter: `lake exe emitword` regenerates the effects
# package's generated word-record mirrors — the receipt and the history
# document (`Cas/Lang/WordWire.lean`) — at the target the tool bakes in
# (a positional path overrides it); `--check` is the byte-identity gate.
[[lean_exe]]
name = "emitword"
srcDir = "tools"
root = "EmitWord"

# The admission-table emitter: `lake exe emitgate` regenerates the
# effects package's generated admission table — what the schema door
# admits, as data — at the target the tool bakes in (a positional path
# overrides it); `--check` is the byte-identity gate.
[[lean_exe]]
name = "emitgate"
srcDir = "tools"
root = "EmitGate"

# The program emitter: `lake exe emitprograms` regenerates the
# straight-line Effect programs of the registered grammar terms at the
# target the tool bakes in (a positional path overrides it); `--check`
# is the byte-identity gate.
[[lean_exe]]
name = "emitprograms"
srcDir = "tools"
root = "EmitPrograms"

# The layer emitter: `lake exe emitlayers` regenerates the effects
# package's generated Effect layers, lowered from the authored service
# topology the tool carries, at the target the tool bakes in (a
# positional path overrides it); `--check` is the byte-identity gate.
[[lean_exe]]
name = "emitlayers"
srcDir = "tools"
root = "EmitLayers"

# The MCP manifest emitter: lake exe mcpspec regenerates the versioned
# CAS tool manifest (the R11 interchange document); --check is the
# byte-identity gate.
[[lean_exe]]
name = "mcpspec"
srcDir = "tools"
root = "EmitMcp"

# The surface ledger: lake exe surface extracts every public Cas
# declaration and signature from the compiled environment into
# meta/out/surface.META.json; --check is the byte-identity gate.
[[lean_exe]]
name = "surface"
srcDir = "tools"
root = "Surface"
supportInterpreter = true

# The obligation ledger: lake exe obligations extracts the named
# obligations already written in the library's docstrings into
# meta/out/obligations.META.json, with the health counters the estate
# otherwise remembers; --check is the byte-identity gate and
# --self-test runs the planted-defect controls.
[[lean_exe]]
name = "obligations"
srcDir = "tools"
root = "Obligations"
supportInterpreter = true

# The law index: `lake exe laws` joins the ruling registry (a Lean
# value) to the `LAW SM-<n>:` lines the enforcing declarations carry at
# the head of their docstrings, emitting meta/out/laws.META.json;
# `--check` is the byte-identity gate and the run also fails on an
# unregistered binding or a status lie. `--self-test` plants one defect
# per rule.
[[lean_exe]]
name = "laws"
srcDir = "tools"
root = "Laws"
supportInterpreter = true

# The debt projection: `lake exe debts` collects everything the library
# owes — the docstring obligations still `owed`/`parked`/`pin pending`,
# and the ruling registry's UNBOUND rows — into
# meta/out/debts.META.json;
# `--check` is the byte-identity gate.
[[lean_exe]]
name = "debts"
srcDir = "tools"
root = "Debts"
supportInterpreter = true

# The axiom gate: `lake exe axioms` collects every declaration's axiom
# dependencies over the same import closure the surface ledger walks,
# emits meta/out/axioms.META.json for the ones that have any, and refuses
# a dependency outside the clean set (`sorryAx`, `ofReduceBool`,
# anything else); `--check` is the byte-identity gate as well.
[[lean_exe]]
name = "axioms"
srcDir = "tools"
root = "Axioms"
supportInterpreter = true

# The meta-schema emitter: `lake exe emitmeta` declares the row and file
# shapes of the described artifacts as terms of a closed schema AST and
# prints each one twice — a JSON Schema per artifact, and the AST itself
# plus the shape values as TypeScript — then prints the meta plane's own
# `meta/MANIFEST.META.json` registry from the same declarations;
# `--check` is the byte-identity gate over all of them.
[[lean_exe]]
name = "emitmeta"
srcDir = "tools"
root = "MetaShapes"

# The lift-manifest emitter: `lake exe emitlift` regenerates the
# effect-lift lane's rule manifest (the R11 interchange document the
# recognition engines consume) at the target the tool bakes in (a
# positional path overrides it); `--check` is the byte-identity gate.
[[lean_exe]]
name = "emitlift"
srcDir = "tools"
root = "EmitLift"

# The grammar-manifest emitter: `lake exe emitgrammar` regenerates the
# data grammar's sort table — wire tags, payload layouts, reference
# discipline — as the JSON the front ends consume at the target the tool
# bakes in (a positional path overrides it) and as `REGISTRY.md`, the
# human kind-tag registry, in place; `--check` is the byte-identity gate
# over both.
[[lean_exe]]
name = "emitgrammar"
srcDir = "tools"
root = "EmitGrammar"

# The architecture emitter: `lake exe emitarchitecture` regenerates the
# effects package's generated self-description — the data vocabulary,
# the seams, the laws, the backends and the capability-matrix pin, as
# data — at the target the tool bakes in (a positional path overrides
# it); `--check` is the byte-identity gate.
[[lean_exe]]
name = "emitarchitecture"
srcDir = "tools"
root = "EmitArchitecture"

# The admission-map emitter: `lake exe admissionmap` regenerates the
# ACC-1 carrier-adequacy table under conformance/ from
# `Cas.Schema.admissionMapV0`, checking en route that every variant of
# the committed inventory has exactly one row; `--check` is the
# byte-identity gate.
[[lean_exe]]
name = "admissionmap"
srcDir = "tools"
root = "AdmissionMap"

# The environment ledger: `lake exe envledger` transcribes the
# configuration plane — mise's tool pins and task graph, every Lake
# project's `lean-toolchain`, and this package's own `[[lean_exe]]`
# blocks joined to the task that drives each one and the `--check` line
# that gates it — into `meta/out/environment.META.json`. File reading
# only, so no `supportInterpreter`; `--check` is the byte-identity gate
# and `--self-test` plants one defect per grammar rule.
[[lean_exe]]
name = "envledger"
srcDir = "tools"
root = "EnvLedger"

# The strata gate: `lake exe strata` reads the `[[lean_lib]]` blocks
# above as the membership authority, imports every member module, reads
# the per-module import edges off the environment header, and refuses an
# out-of-stratum import — floor purity, floor independence, direction,
# and the KNOWN MISFILES accounting — into
# `meta/out/strata.META.json`. `supportInterpreter` because it imports
# the compiled library; `--check` is the byte-identity gate.
[[lean_exe]]
name = "strata"
srcDir = "tools"
root = "Strata"
supportInterpreter = true

# The trust census: `lake exe trust` classifies every TypeScript file
# the effects package SHIPS (`src/` and `bin/`; the test tree is the
# census's input, not its subject) into the four strata — emitted from
# the Lean model, model-gated by a conformance artifact, imported by a
# test, or bare — into `meta/out/trust.META.json`. File reading only, so
# no `supportInterpreter`; `--check` is the byte-identity gate.
[[lean_exe]]
name = "trust"
srcDir = "tools"
root = "TrustCensus"

# The estate-native materializer: `lake exe materialize` reads the
# committed schema payloads back through the ingestion door and prints
# each one as a provenance-stamped TypeScript module under the effects
# package's test tree — the second register of the P6 differential
# (`Cas.Materialize.source` is the first). A bare fixture name selects
# one; `--all` (or nothing) is every registered fixture; `--check` is
# the byte-identity gate.
[[lean_exe]]
name = "materialize"
srcDir = "tools"
root = "Materialize"
